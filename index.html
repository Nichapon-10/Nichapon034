(function(){

  var DUR = 400;

  /* ---- decode labels (Latin labels only; Thai text is set directly) ---- */
  var labels = [].slice.call(document.querySelectorAll('.t'));
  labels.forEach(function(el){ el.dataset.text = el.textContent; });

  function reserve(){
    var w = [];
    labels.forEach(function(el){ if(!el.hasAttribute('data-free')) el.style.width = ''; });
    labels.forEach(function(el){ w.push(el.getBoundingClientRect().width); });
    labels.forEach(function(el,i){ if(!el.hasAttribute('data-free')) el.style.width = (Math.ceil(w[i]*100)/100) + 'px'; });

    if (el._t){ clearTimeout(el._t); el._t = 0; }

  function decode(el, dur){
    var text = el.dataset.text, n = text.length;
    if (RM || /[^\x00-\x7F]/.test(text)){ settle(el); return; }

    function roll(){ for (var i=0;i<n;i++) rand[i] = CH.charAt((Math.random()*26)|0); }
    roll();
    function step(now){
      var p = Math.min(1,(now - t0)/D), front = p*n, out = '', i;
      if (now - lastRoll > 45){ roll(); lastRoll = now; }
      for (i=0;i<n;i++){
        var c = text.charAt(i);
        if (i < front) out += c;
        else if (i < front + 3.6) out += (c === ' ' ? ' ' : rand[i]);
        else break;
      }
      el.textContent = out;
      if (p < 1) el._raf = requestAnimationFrame(step); else settle(el);
    }
    el._raf = requestAnimationFrame(step);
    el._t = setTimeout(function(){ settle(el); }, D + 500);
  }

    var t = el.querySelector('.t');

  /* ---- parallax ---- */

    var w=innerWidth, h=innerHeight, dx=-cx*w*0.0156, dy=-cy*h*0.015;
    var cover = 2*Math.max(Math.abs(dx)/w, Math.abs(dy)/h);
    var sc = 1 + cover + 0.014*Math.max(0,cy);
    bg.style.transform = 'translate3d('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px,0) scale('+sc.toFixed(4)+')';
    if (Math.abs(tx-cx)<0.0004 && Math.abs(ty-cy)<0.0004){ running=false; return; }

      p:'สมุดงานบน Google Colab กดปุ่มด้านล่างเพื่อเปิดงานในแท็บใหม่',
      n:'1 / 5', cta:[{t:'เปิดงานใน Colab', href:'https://colab.research.google.com/drive/1ZAq03VIwVlrhGn0pZiZHt2bGVfPr83M2?usp=sharing'}]},
    hw2:{h:['การบ้านที่ 2 ','Google Drive'],
      p:'เอกสาร PDF ที่เก็บไว้ใน Google Drive กดปุ่มด้านล่างเพื่อเปิดไฟล์ในแท็บใหม่',
      n:'2 / 5', cta:[{t:'เปิดไฟล์ PDF', href:'https://drive.google.com/file/d/1Re4HtuYdyhUBp7tx3wJruiBbLOPzqbj5/view?usp=sharing'}]},
    hw3:{h:['การบ้านที่ 3 ','Google Colab'],
      p:'สมุดงานบน Google Colab กดปุ่มด้านล่างเพื่อเปิดงานในแท็บใหม่',
      n:'3 / 5', cta:[{t:'เปิดงานใน Colab', href:'https://colab.research.google.com/drive/1EtmML5fn_sHJxEQ2jocxpQXa5vP5F-cq?usp=sharing'}]},
    hw4:{h:['การบ้านที่ 4 ','Google Drive'],
      p:'ไฟล์งานที่เก็บไว้ใน Google Drive กดปุ่มด้านล่างเพื่อเปิดไฟล์ในแท็บใหม่',
      n:'4 / 5', cta:[{t:'เปิดไฟล์งาน', href:'https://drive.google.com/file/d/1yzcu7TWSOesAWGXsNAUSOqUDN--I9sy7/view?usp=sharing'}]},
    hw5:{h:['การบ้านที่ 5 ','Streamlit App'],
      p:'เว็บแอประบบแนะนำที่สร้างด้วย Streamlit พร้อมเอกสาร PDF ประกอบงานใน Google Drive',
      n:'5 / 5', cta:[{t:'เปิดเว็บแอป', href:'https://recommendation-n7trbqb2okpncbzyubbucj.streamlit.app/'},
                     {t:'ดูไฟล์ PDF', href:'https://drive.google.com/file/d/1proxjPaB3mA0pIO4_Qentwa_XKdkaCnN/view?usp=sharing'}]}
  };
  var ORDER = ['profile','hw1','hw2','hw3','hw4','hw5'];
  var hero = document.querySelector('.hero');
  var rises = [].slice.call(hero.querySelectorAll('.hrise'));
  var blurb = hero.querySelector('.blurb');
  var ctas = [].slice.call(document.querySelectorAll('.cta'));
  var count = document.querySelector('.count .t');
  var chapter = 'profile', swapT = 0;

  function applyCta(list){
    ctas.forEach(function(a,i){
      var d = list[i];
      if (!d){ a.hidden = true; return; }
      a.hidden = false;
      var t = a.querySelector('.t'); t.dataset.text = d.t; t.textContent = d.t;
      a.setAttribute('href', d.href);
      if (d.go){ a.dataset.go = d.go; a.removeAttribute('target'); a.removeAttribute('rel'); }
      else { delete a.dataset.go; a.setAttribute('target','_blank'); a.setAttribute('rel','noopener noreferrer'); }
    });
  }
  function select(id){
    if (!DATA[id] || id === chapter) return;
    chapter = id;
    [].forEach.call(document.querySelectorAll('.index li'), function(li){
      var a = li.querySelector('a'), on = a.getAttribute('href') === '#'+id;
      li.classList.toggle('on', on);
      if (on){ a.setAttribute('aria-current','true'); decode(a.querySelector('.t')); } else a.removeAttribute('aria-current');
    });
    count.dataset.text = DATA[id].n; decode(count);
    var c = DATA[id];
    clearTimeout(swapT);
    hero.classList.add('swapping');
    swapT = setTimeout(function(){
      rises[0].textContent = c.h[0]; rises[1].textContent = c.h[1];
      rises.forEach(function(r){ r.parentNode.classList.toggle('lat', !/[\u0E00-\u0E7F]/.test(r.textContent)); });
      blurb.textContent = c.p;
      applyCta(c.cta);
      void hero.offsetWidth;
      hero.classList.remove('swapping');
    }, RM ? 0 : 500);
  }
  [].forEach.call(document.querySelectorAll('.index a, .logo'), function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); select(a.getAttribute('href').slice(1)); });
  });
  ctas.forEach(function(a){
    a.addEventListener('click', function(e){ if (a.dataset.go){ e.preventDefault(); select(a.dataset.go); } });
  });
  function step(d){ select(ORDER[(ORDER.indexOf(chapter)+d+ORDER.length) % ORDER.length]); }
  document.querySelector('.prev').addEventListener('click', function(){ step(-1); });
  document.querySelector('.next').addEventListener('click', function(){ step(1); });

  /* ---- chamfered CTA outline, sized to its label ---- */
  var probe = document.createElement('i');
  probe.style.cssText = 'position:absolute;visibility:hidden;height:0;width:calc(1*var(--t))';
  document.body.appendChild(probe);
  function edge(a){
    var t = probe.getBoundingClientRect().width || 1, w = a.offsetWidth, h = a.offsetHeight;
    if (!w) return;
    var c = 10*t, s = 3*t;
    a.querySelector('.cta-edge').setAttribute('viewBox','0 0 '+w+' '+h);
    a.querySelector('.cta-edge path').setAttribute('d',
      'M'+(s+.5)+' .5 H'+(w-c-.5)+' L'+(w-.5)+' '+(c+.5)+' V'+(h-s-.5)+' L'+(w-s-.5)+' '+(h-.5)+
      ' H'+(c+.5)+' L.5 '+(h-c-.5)+' V'+(s+.5)+' Z');
  }
  function edges(){ ctas.forEach(edge); }
  if (window.ResizeObserver){
    var ro = new ResizeObserver(function(es){ es.forEach(function(en){ edge(en.target); }); });
    ctas.forEach(function(a){ ro.observe(a); });
  }

  /* ---- boot ---- */
  function boot(){
    reserve(); edges();
    if (RM) return;
    function at(sel, t0, st){
      [].slice.call(document.querySelectorAll(sel)).forEach(function(el,i){
        setTimeout(function(){ decode(el); }, t0 + i*(st||0));
      });
    }
    at('.logo .t', 200);
    at('.enter .t', 330);
    at('.menu .t', 390);
    at('.index li.on .t', 660);
    at('.index li:not(.on) .t', 720, 55);
    at('.dock .t', 1000, 60);
    setTimeout(function(){ document.documentElement.classList.remove('anim'); }, 2200);
    setTimeout(function(){ labels.forEach(settle); }, 2600);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else addEventListener('load', boot);
  var rt;
  addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ reserve(); edges(); }, 160); });
})();
</script>
